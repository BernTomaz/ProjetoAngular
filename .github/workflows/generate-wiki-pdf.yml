name: 📘 Gerar Manual da Wiki em PDF

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Clonar repositório principal
        uses: actions/checkout@v4

      - name: 📥 Clonar Wiki
        run: git clone https://github.com/${{ github.repository }}.wiki.git wiki

      - name: ⚙️ Instalar Pandoc e LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-plain-generic

      - name: 📝 Gerar PDF da Wiki com capa estilizada
        run: |
          cd wiki

          # Criar arquivo de metadata (capa)
          cat <<EOF > meta.yaml
          title: "📘 Manual do ProjetoAngular"
          subtitle: "Documentação Técnica da Wiki"
          author: "BernTomaz"
          date: "`date +%Y`"
          EOF

          # Gerar PDF respeitando a ordem da Wiki e com sumário em página separada
          pandoc Home.md Instalacao.md Estrutura-do-Projeto.md Guia-de-Desenvolvimento.md API-e-Integracao.md Deploy.md Contribuicao.md FAQ.md \
            -o ../Manual-ProjetoAngular.pdf \
            --from markdown \
            --pdf-engine=xelatex \
            --metadata-file=meta.yaml \
            --toc --toc-depth=2 \
            -V toc-title="📑 Sumário" \
            -V toc-own-page=true \
            -V geometry:margin=2.5cm \
            -V fontsize=12pt \
            -V mainfont="DejaVu Serif" \
            -V monofont="DejaVu Sans Mono"

      - name: 📤 Upload PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Manual-ProjetoAngular
          path: Manual-ProjetoAngular.pdf
