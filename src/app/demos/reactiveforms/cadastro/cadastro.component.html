<div class="container main-container">
  <h4>Demo Cadastro</h4>
  <hr />

  <form novalidate (ngSubmit)="adicionarUsuario()" [formGroup]="cadastroForm" class="form-horizontal">

  <!-- Nome -->
  <div class="form-group">
    <label class="col-md-2 control-label mt-2" for="nome">Nome Completo</label>
    <div class="col-md-10">
      <input
        class="form-control"
        id="nome"
        type="text"
        placeholder="Nome (requerido)"
        formControlName="nome"
      />
    </div>
  </div>

  <!-- CPF -->
  <div class="form-group">
    <label class="col-md-2 control-label mt-2" for="cpf">CPF</label>
    <div class="col-md-10">
      <input
        class="form-control"
        id="cpf"
        type="text"
        placeholder="CPF (requerido)"
        formControlName="cpf"
      />
    </div>
  </div>

  <!-- Email -->
  <div class="form-group">
    <label class="col-md-2 control-label mt-2" for="email">E-mail</label>
    <div class="col-md-10">
      <input
        class="form-control"
        id="email"
        type="email"
        placeholder="E-mail (requerido)"
        formControlName="email"
      />
    </div>
  </div>

  <!-- Senha -->
  <div class="form-group">
    <label class="col-md-2 control-label mt-2" for="senha">Senha</label>
    <div class="col-md-10">
      <input
        class="form-control"
        id="senha"
        type="password"
        placeholder="Senha (requerido)"
        formControlName="senha"
      />
    </div>
  </div>

  <!-- Confirmação de Senha -->
  <div class="form-group">
    <label class="col-md-2 control-label mt-2" for="senhaConfirmacao">Confirme a Senha</label>
    <div class="col-md-10">
      <input
        class="form-control"
        id="senhaConfirmacao"
        type="password"
        placeholder="Confirme a senha (requerido)"
        formControlName="senhaConfirmacao"
      />
    </div>
  </div>

  <!-- Botão -->
  <div class="form-group mt-3">
    <div class="col-md-4 col-md-offset-2">
      <button class="btn btn-success" type="submit">
        Registrar
      </button>
    </div>
  </div>

</form>   
</div>
