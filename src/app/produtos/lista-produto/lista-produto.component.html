<div class="container main-container">
  <div class="row justify-content-start">
    <div *ngFor="let produto of produtos; trackBy: trackById" class="col-12 col-sm-8 col-md-6 col-lg-4 mb-3">
      <div class="card h-100 shadow-sm border-0">
        <img [src]="produto.imagem" class="card-img-top" [alt]="produto.nome">
        <div class="card-body text-center">
          <h4 class="card-title mb-2">{{ produto.nome }}</h4>
          <small class="text-muted d-block mb-2">Por apenas:</small>
          <h4 class="fw-bold mb-0">
            {{ (produto.promocao ? produto.valorPromo : produto.valor) | currency:'BRL':'symbol':'1.0-0' }}
          </h4>
        </div>
        <div class="card-footer bg-light border-0 text-center">
          <button class="btn btn-primary">
            <span class="fa fa-shopping-cart me-1"></span> Comprar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
