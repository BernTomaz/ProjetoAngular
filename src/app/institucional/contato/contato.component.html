

<div class="container py-5">
  
  <div class="text-center mb-4">
    <h1 class="fw-bold mb-1 mt-4">Fale Conosco</h1>
    <p class="text-muted mb-0">Envie uma mensagem e entraremos em contato o mais breve possível.</p>
  </div>

  
  <div class="row">
    <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6 mx-auto">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form>
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" autocomplete="name" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            </div>

            <div class="mb-3">
              <label for="mensagem" class="form-label">Mensagem</label>
              <textarea class="form-control" id="mensagem" rows="4" placeholder="Digite sua mensagem" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Enviar Mensagem</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  
  <div class="row mt-4">
    <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6 mx-auto text-center">
      <h4 class="mb-1">Nosso Endereço</h4>
      <p class="mb-0 fw-semibold">Empresa XYZ</p>
      <p class="mb-0">Rua Exemplo, 123 - Centro</p>
      <p class="mb-3">Cidade, Estado - CEP: 00000-000</p>

      <h4 class="mt-3 mb-0">Contato</h4>
      <p class="mb-0"><i class="bi bi-telephone-fill me-2"></i>(11) 1234-5678</p>

      <h4 class="mt-4 mb-0">Redes Sociais</h4>
      <div class="d-flex justify-content-center gap-3">
        <a href="#" class="text-decoration-none" aria-label="Facebook"><i class="bi bi-facebook fs-4"></i></a>
        <a href="#" class="text-decoration-none" aria-label="Instagram"><i class="bi bi-instagram fs-4"></i></a>
        <a href="#" class="text-decoration-none" aria-label="LinkedIn"><i class="bi bi-linkedin fs-4"></i></a>
      </div>
    </div>
  </div>
</div>
